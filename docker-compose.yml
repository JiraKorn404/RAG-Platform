x-dagster-env: &dagster-env
  DAGSTER_HOME: /opt/dagster/dagster_home
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
  DATA_DIR: /app/data
  # The experiment a PDF put into data/raw is ingested with; the sensor reads it at every tick.
  INGEST_CONFIG: /app/config/ingest.yaml
  # LlamaIndex's sentence splitter downloads NLTK data on first use; keep it in the model_cache volume.
  NLTK_DATA: /root/.cache/nltk_data
  QDRANT_URL: http://qdrant:6333
  METRICS_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/rag_metrics
  # The database for imported tables: one role loads data, one only reads (see src/rag_lab/sql/).
  SQL_LOADER_URL: postgresql://rag_loader:${SQL_LOADER_PASSWORD}@postgres:5432/rag_data
  SQL_READER_URL: postgresql://rag_reader:${SQL_READER_PASSWORD}@postgres:5432/rag_data

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: dagster
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d dagster"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Named volume only: a Windows bind mount can corrupt Qdrant's data.
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  # Runs once when the stack starts and exits: creates our two databases if they are missing, applies
  # the migrations and makes the roles (src/rag_lab/setup.py). The UI and Dagster wait for it.
  setup:
    build:
      context: .
      dockerfile: docker/dagster/Dockerfile
    image: rag-platform:latest
    command: python -m rag_lab.setup
    environment: *dagster-env
    volumes:
      - ./src:/app/src
    depends_on:
      postgres:
        condition: service_healthy

  dagster-code:
    image: rag-platform:latest
    command: dagster api grpc -h 0.0.0.0 -p 4000 -m rag_lab.definitions
    environment: *dagster-env
    volumes:
      - ./src:/app/src
      - ./data:/app/data
      - ./config:/app/config:ro
      # Docling model downloads (Hugging Face + Docling's own cache) land here, not in the image.
      - model_cache:/root/.cache
      - dagster_storage:/opt/dagster/storage
      # The instance settings are mounted over the copy in the image, so an edit needs a restart, not a build.
      - ./docker/dagster/dagster.yaml:/opt/dagster/dagster_home/dagster.yaml:ro
    depends_on:
      setup:
        condition: service_completed_successfully
      qdrant:
        condition: service_started

  dagster-webserver:
    image: rag-platform:latest
    command: dagster-webserver -h 0.0.0.0 -p 3000 -w /opt/dagster/dagster_home/workspace.yaml
    environment: *dagster-env
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - dagster_storage:/opt/dagster/storage
      - ./docker/dagster/dagster.yaml:/opt/dagster/dagster_home/dagster.yaml:ro
    depends_on:
      setup:
        condition: service_completed_successfully
      dagster-code:
        condition: service_started

  dagster-daemon:
    image: rag-platform:latest
    command: dagster-daemon run -w /opt/dagster/dagster_home/workspace.yaml
    environment: *dagster-env
    volumes:
      - dagster_storage:/opt/dagster/storage
      - ./docker/dagster/dagster.yaml:/opt/dagster/dagster_home/dagster.yaml:ro
    depends_on:
      setup:
        condition: service_completed_successfully
      dagster-code:
        condition: service_started

  # Dashboard over rag_metrics and a page for trying queries across experiments.
  ui:
    image: rag-platform:latest
    command: streamlit run app.py --server.address 0.0.0.0 --server.port 8501
    working_dir: /app/ui # so Streamlit finds ui/.streamlit/config.toml
    environment: *dagster-env
    ports:
      - "127.0.0.1:8501:8501"
    volumes:
      - ./src:/app/src
      - ./ui:/app/ui
      # The upload page parses, chunks and embeds in this container: uploads and artifacts under
      # ./data, and Docling's models and the Qwen3 tokenizer in the shared cache volume.
      - ./data:/app/data
      - model_cache:/root/.cache
    depends_on:
      setup:
        condition: service_completed_successfully
      qdrant:
        condition: service_started
      dagster-code:
        condition: service_started

volumes:
  postgres_data:
  qdrant_data:
  model_cache:
  dagster_storage:
