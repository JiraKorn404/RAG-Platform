# Our services only. PostgreSQL and Qdrant are not here: on this machine docker-compose.local.yml adds
# them, and on the VM docker-compose.vm.yml joins the network of the ones that already run. `.env` names
# the files to use in COMPOSE_FILE, so `docker compose up -d` is the command on both.
#
# Every service gets the whole of .env (passwords and addresses, which config/connections.yaml refers
# to as ${NAME}, and what docker/dagster.yaml reads), so a new variable is added in .env only.

x-env: &env
  DATA_DIR: /app/data
  # The settings: connections.yaml, pipeline.yaml and llm.yaml (see src/rag_lab/core/settings.py).
  RAG_CONFIG_DIR: /app/config

x-dagster-env: &dagster-env
  <<: *env
  DAGSTER_HOME: /opt/dagster/dagster_home
  # LlamaIndex's sentence splitter downloads NLTK data on first use; keep it in the model_cache volume.
  NLTK_DATA: /root/.cache/nltk_data

services:
  # Runs once when the stack starts and exits: checks that the databases can be reached and applies our
  # migrations (src/rag_lab/core/setup.py). The others wait for it. It creates no database and no role:
  # that is scripts/provision.sql.
  setup:
    build:
      context: .
      dockerfile: docker/serve.Dockerfile
    image: rag-platform-serve:latest
    command: python -m rag_lab setup
    env_file: .env
    environment: *env
    volumes:
      - ./src:/app/src
      - ./config:/app/config:ro

  # The HTTP API (src/rag_lab/serve/api.py): what the UI and the platform's backend call.
  api:
    image: rag-platform-serve:latest
    restart: unless-stopped
    command: uvicorn rag_lab.serve.api:app --host 0.0.0.0 --port 8000
    env_file: .env
    environment: *env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./src:/app/src
      - ./config:/app/config:ro
      # The pictures of picture chunks are read from data/artifacts, and deleting a document or an
      # experiment removes its files there.
      - ./data:/app/data
    depends_on:
      setup:
        condition: service_completed_successfully

  # The Streamlit app: the Experiments page and the Chatbot. It only talks to the API.
  ui:
    image: rag-platform-serve:latest
    restart: unless-stopped
    command: streamlit run app.py --server.address 0.0.0.0 --server.port 8501
    working_dir: /app/ui # so Streamlit finds ui/.streamlit/config.toml
    env_file: .env
    environment: *env
    ports:
      - "127.0.0.1:8501:8501"
    volumes:
      - ./src:/app/src
      - ./ui:/app/ui
      - ./config:/app/config:ro
    depends_on:
      api:
        condition: service_started

  # Our code as Dagster sees it: the assets, the jobs and the two sensors. Runs execute here.
  dagster-code:
    build:
      context: .
      dockerfile: docker/ingest.Dockerfile
    image: rag-platform-ingest:latest
    restart: unless-stopped
    command: dagster api grpc -h 0.0.0.0 -p 4000 -m rag_lab.ingest.definitions
    env_file: .env
    environment: *dagster-env
    volumes:
      - ./src:/app/src
      - ./data:/app/data
      - ./config:/app/config:ro
      # Docling's models, the tokenizers and NLTK data are downloaded here, not into the image.
      - model_cache:/root/.cache
      - dagster_storage:/opt/dagster/storage
      # The instance settings are mounted over the copy in the image, so an edit needs a restart, not a build.
      - ./docker/dagster.yaml:/opt/dagster/dagster_home/dagster.yaml:ro
    depends_on:
      setup:
        condition: service_completed_successfully

  dagster-webserver:
    image: rag-platform-ingest:latest
    restart: unless-stopped
    command: dagster-webserver -h 0.0.0.0 -p 3000 -w /opt/dagster/dagster_home/workspace.yaml
    env_file: .env
    environment: *dagster-env
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - dagster_storage:/opt/dagster/storage
      - ./docker/dagster.yaml:/opt/dagster/dagster_home/dagster.yaml:ro
    depends_on:
      setup:
        condition: service_completed_successfully
      dagster-code:
        condition: service_started

  # Ticks the sensors and starts the queued runs.
  dagster-daemon:
    image: rag-platform-ingest:latest
    restart: unless-stopped
    command: dagster-daemon run -w /opt/dagster/dagster_home/workspace.yaml
    env_file: .env
    environment: *dagster-env
    volumes:
      - dagster_storage:/opt/dagster/storage
      - ./docker/dagster.yaml:/opt/dagster/dagster_home/dagster.yaml:ro
    depends_on:
      setup:
        condition: service_completed_successfully
      dagster-code:
        condition: service_started

volumes:
  model_cache:
  dagster_storage:
