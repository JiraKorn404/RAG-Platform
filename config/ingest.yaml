# The experiment a PDF put into data/raw is ingested with. The sensor reads this file each time a new
# PDF arrives, so an edit applies to the next PDF with no restart.
#
# The keys are those of the experiment config (src/rag_lab/config.py: ExperimentConfig). A key left out
# keeps its default; an unknown key is an error, shown on the sensor in the Dagster UI.
# Settings cannot change under the same name: to change one, change `name` too (a new experiment).
name: test-ingest

parse:
  ocr: false          # true: scanned pages are read with glm-ocr (about 18 s a page)
  pictures: false     # true: each picture becomes a chunk; needs an embedding model that takes images

chunk:
  strategy: hybrid    # hybrid, hierarchical, fixed, recursive or semantic
  max_tokens: 512

embed:
  # qwen3-embedding:0.6b, qwen3-embedding:4b, qwen3-embedding:8b or embeddinggemma-2:740m
  model: embeddinggemma-2:740m

index:
  # a BM25 vector, needed by hybrid search and the Chatbot
  sparse: true        
