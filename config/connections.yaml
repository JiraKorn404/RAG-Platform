# Where every service is. To use another server, change its line here (or the value in .env it refers to).
# config/connections.vm.example.yaml is this file as it looks on a server that already has PostgreSQL
# and Qdrant.
#
# ${NAME} is replaced with the environment variable of that name, which the containers get from .env:
# passwords and private addresses stay there, out of git. The passwords go into a URL, so they may only
# have letters and digits.
#
# After an edit: Dagster reads this file at its next sensor tick or run; the API and the UI keep their
# clients, so `docker compose restart api ui`.

ollama:
  url: ${OLLAMA_BASE_URL}       # for an Ollama on this machine: http://host.docker.internal:11434

qdrant:
  url: http://qdrant:6333

# Chats, metrics and the registry of tables. Our tables are made in `schema`, which must exist and belong
# to this role. scripts/provision.sql makes the database, the schema and the roles below; the local
# stack runs it by itself (docker-compose.local.yml).
app_database:
  url: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/rag_metrics
  schema: rag

# The tables the SQL chatbot answers from. The reader role can only SELECT and is what runs the
# chatbot's SQL. The loader role creates and fills the tables of the CSV files in data/tables; leave
# `loader_url` out where the tables are already in the database, and name their schemas in
# `existing_schemas` instead (then: scripts/grant_read.sql, and `python -m rag_lab tables register`).
tables_database:
  reader_url: postgresql://rag_reader:${SQL_READER_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/rag_data
  loader_url: postgresql://rag_loader:${SQL_LOADER_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/rag_data
  existing_schemas: []

# The HTTP API. `url` is where the Streamlit UI finds it. With a `key`, a caller must send it in the
# X-API-Key header; write it as ${RAG_API_KEY} and put the value in .env.
api:
  url: http://api:8000
  key: ""

# Not here: Dagster's own database. Dagster reads it from docker/dagster.yaml, which takes the server
# from the same POSTGRES_* values of .env and the database name from DAGSTER_POSTGRES_DB.
