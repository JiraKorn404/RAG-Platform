# Dagster's own database. Dagster reads only this file, not config/connections.yaml, so the server and
# the database name come from .env, like the user and the password.
storage:
  postgres:
    postgres_db:
      username: { env: POSTGRES_USER }
      password: { env: POSTGRES_PASSWORD }
      hostname: { env: POSTGRES_HOST }
      port: { env: POSTGRES_PORT }
      db_name: { env: DAGSTER_POSTGRES_DB }

# Logs and artifacts sit on a volume shared by the webserver, daemon and code location.
local_artifact_storage:
  module: dagster.core.storage.root
  class: LocalArtifactStorage
  config:
    base_dir: /opt/dagster/storage

compute_logs:
  module: dagster.core.storage.local_compute_log_manager
  class: LocalComputeLogManager
  config:
    base_dir: /opt/dagster/storage/compute_logs

# One run at a time: every ingest run loads Docling's models, and there is one Ollama. PDFs that arrive
# together are ingested one after another.
run_coordinator:
  module: dagster.core.run_coordinator
  class: QueuedRunCoordinator
  config:
    max_concurrent_runs: 1
