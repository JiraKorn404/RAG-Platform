[project]
name = "rag-lab"
version = "0.1.0"
description = "Lab for PDF ingestion into Qdrant, orchestrated by Dagster"
requires-python = ">=3.12"
dependencies = [
    "dagster",
    "dagster-webserver",
    "dagster-postgres",
    # SQLAlchemy 2.1 defaults postgresql:// to psycopg 3, which breaks dagster-postgres' NOTIFY.
    "sqlalchemy<2.1",
    "qdrant-client",
    "httpx",
    "psycopg[binary]",
    "docling",
    "llama-index-core>=0.14.25,<0.15",
    "llama-index-readers-docling>=0.5,<0.6",
    "llama-index-node-parser-docling>=0.5,<0.6",
    "llama-index-vector-stores-qdrant>=0.10,<0.11",
    "streamlit",
    "langgraph",
    "langchain-ollama",
    "sqlglot",  # parses a generated query to check it before it runs (src/rag_lab/sql/guard.py)
    "pyyaml",  # config/ingest.yaml, the experiment the sensor ingests new PDFs with
]

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_lab"]

[tool.ruff]
line-length = 100
src = ["src"]
